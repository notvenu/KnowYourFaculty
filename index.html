<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>VIT-AP Faculty Reviews & Ratings | KnowYourFaculty</title>
    <meta name="author" content="KnowYourFaculty" />

    <meta name="theme-color" content="#2f5bd0" />
    <meta name="color-scheme" content="light dark" />

    <!-- Title, description, canonical, Open Graph, Twitter and JSON-LD are written per route:

    <meta
      name="description"
      content="Anonymous VIT-AP faculty reviews from real students. Compare professors by theory, lab and ECS before you register."
      data-seo
    />
    <!--seo:end-->

    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap"
      />

  <body>
